<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фотопортфоліо Природи | Контакти</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Шапка сайту з навігацією -->
  <header>
    <div class="header-container">
      <div class="logo">
        <h1>Світ Природи</h1>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Головна</a></li>
          <li><a href="gallery.html">Галерея</a></li>
          <li><a href="about.html">Про мене</a></li>
          <li><a href="contact.html" class="active">Контакти</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Основний контент із формою -->
  <main>
    <section class="contact-section">
      <h2>Напиши мені ✉️</h2>
      <p>Сподобалися фотографії чи маєш запитання? Залишай повідомлення через форму нижче, і я обов'язково відповім!</p>
      
      <!-- Форма зворотного зв'язку (містить 4 різних типи полів: text, email, select, textarea) -->
      <form class="contact-form">
        <div class="form-group">
          <label for="name">Твоє ім'я:</label>
          <input type="text" id="name" name="name" required placeholder="Введи своє ім'я">
        </div>
        
        <div class="form-group">
          <label for="email">Електронна пошта:</label>
          <input type="email" id="email" name="email" required placeholder="name@example.com">
        </div>

        <div class="form-group">
          <label for="topic">Тема звернення:</label>
          <select id="topic" name="topic">
            <option value="photos">Питання щодо фотографій</option>
            <option value="cooperation">Пропозиція співпраці</option>
            <option value="other">Інше</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="message">Повідомлення:</label>
          <textarea id="message" name="message" rows="5" required placeholder="Напиши своє повідомлення тут..."></textarea>
        </div>
        
        <button type="submit" class="btn">Надіслати</button>
      </form>
    </section>
  </main>

  <!-- Підвал сайту -->
  <footer>
    <p>&copy; 2026 Світ Природи. Авторське фотопортфоліо. Усі права захищено.</p>
  </footer>

</body>
</html>
